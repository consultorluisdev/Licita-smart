# Blueprint do Render — Licita Smart
# Deploy: Render Dashboard > New > Blueprint > selecione este repositório
#
# O AI Agent agora roda DENTRO da API (.NET), em POST /api/v1/chat.
# O serviço Rust (licita-agent) foi removido: menos um container, build de ~20s.
# O front deve usar VITE_AGENT_URL igual ao VITE_API_URL.

databases:
  - name: licita-db
    databaseName: licitasmart
    user: licita
    plan: free

services:
  # ---------------- API .NET (inclui o agente em /api/v1/chat) ----------------
  - type: web
    name: licita-api
    runtime: docker
    dockerfilePath: ./backend/licitasmart.Api/src/LicitaSmart.Api/Dockerfile
    dockerContext: ./backend/licitasmart.Api/src/LicitaSmart.Api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: licita-db
          property: connectionString
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: 'true'
      # sincronização automática com o PNCP (pode desligar em prod: false)
      - key: Pncp__Habilitado
        value: 'true'
      - key: Pncp__UF
        value: SC
      # --- agente ---
      # Ollama não roda no Render (precisa de GPU/RAM local), então em produção
      # use Agent__Provider=openai + chave. Sem isso, /api/v1/chat responde 503.
      - key: Agent__Provider
        sync: false
      - key: Agent__Model
        sync: false
      - key: Agent__OpenAiApiKey
        sync: false
